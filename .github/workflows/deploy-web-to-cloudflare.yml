name: Deploy Web to Cloudflare

on:
  workflow_run:
    workflows: ["Deploy API to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thrift-web-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
      }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SERVER: ${{ vars.NEXT_PUBLIC_SERVER }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
      NEXT_PUBLIC_SEARCH: ${{ vars.NEXT_PUBLIC_SEARCH }}
      NEXT_PUBLIC_SEARCH_KEY: ${{ vars.NEXT_PUBLIC_SEARCH_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment configuration
        run: |
          : "${NEXT_PUBLIC_SERVER:?Set the NEXT_PUBLIC_SERVER repository variable to the Cloudflare API URL}"
          : "${NEXT_PUBLIC_SUPABASE_URL:?Set the NEXT_PUBLIC_SUPABASE_URL repository variable}"
          : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY:?Set the NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"

      - name: Build and deploy Worker
        run: pnpm --filter thrift-web deploy
