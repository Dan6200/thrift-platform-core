name: Deploy API to Cloudflare

on:
  workflow_run:
    workflows: ["Thrift-api Testing"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thrift-api-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable automatic deployment after Cloudflare credentials and Hyperdrive
    # are provisioned by setting the CLOUDFLARE_DEPLOY_ENABLED repo variable.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Hyperdrive binding
        working-directory: packages/thrift-api
        env:
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_HYPERDRIVE_ID" ]; then
            echo "Set the CLOUDFLARE_HYPERDRIVE_ID repository variable." >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const file = "wrangler.jsonc";
            const marker = "REPLACE_WITH_CLOUDFLARE_HYPERDRIVE_ID";
            const config = fs.readFileSync(file, "utf8");
            if (!config.includes(marker)) throw new Error("Hyperdrive marker missing from wrangler.jsonc");
            fs.writeFileSync(file, config.replace(marker, process.env.CLOUDFLARE_HYPERDRIVE_ID));
          '

      - name: Ensure workers.dev subdomain
        working-directory: packages/thrift-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Set the CLOUDFLARE_API_TOKEN repository secret.');

          const config = await readFile('wrangler.jsonc', 'utf8');
          const accountId = config.match(/"account_id"\s*:\s*"([a-f0-9]{32})"/i)?.[1];
          if (!accountId) throw new Error('A valid account_id must be set in wrangler.jsonc.');

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`;
          async function cloudflareRequest(method, body) {
            const response = await fetch(endpoint, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const payload = await response.json().catch(() => ({}));
            return { response, payload };
          }

          let { response, payload } = await cloudflareRequest('GET');
          if (response.ok && payload.success && payload.result?.subdomain) {
            console.log(`Using existing workers.dev subdomain: ${payload.result.subdomain}`);
          } else if (response.status === 404 || (response.ok && payload.success)) {
            ({ response, payload } = await cloudflareRequest('PUT', { subdomain: 'thrift-commerce' }));
            if (!response.ok || !payload.success || payload.result?.subdomain !== 'thrift-commerce') {
              const codes = Array.isArray(payload.errors) ? payload.errors.map((error) => error.code).filter(Boolean).join(', ') : '';
              throw new Error(`Could not register the thrift-commerce workers.dev subdomain (HTTP ${response.status}${codes ? `, error codes ${codes}` : ''}). Check the token's Workers Scripts Write permission and account-level subdomain availability.`);
            }
            console.log('Registered workers.dev subdomain: thrift-commerce');
          } else {
            const codes = Array.isArray(payload.errors) ? payload.errors.map((error) => error.code).filter(Boolean).join(', ') : '';
            throw new Error(`Could not read the workers.dev subdomain (HTTP ${response.status}${codes ? `, error codes ${codes}` : ''}). Check the token's Workers Scripts Read and Write permissions.`);
          }
          NODE

      - name: Build and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter thrift-api worker:deploy

      - name: Smoke test deployed API
        run: |
          curl --fail --show-error --retry 8 --retry-delay 5 --retry-all-errors https://thrift-api.thrift-commerce.workers.dev/api.json
          curl --fail --show-error --retry 8 --retry-delay 5 --retry-all-errors https://thrift-api.thrift-commerce.workers.dev/api
          curl --fail --show-error --retry 8 --retry-delay 5 --retry-all-errors "https://thrift-api.thrift-commerce.workers.dev/v1/products?limit=1"
